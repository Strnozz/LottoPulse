<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex,nofollow">
  <title>Attivazione LottoPulse</title>
  <link rel="icon" href="../assets/lottopulse-icon.webp">
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#111116;--stroke:#292932;--text:#f5f5f7;--muted:#aeb2bf;--muted2:#7e8390;--orange:#ff7a45;--green:#61d6a7;--red:#ff8a73}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(650px 420px at 50% 0%,rgba(255,122,69,.10),transparent 68%),radial-gradient(480px 320px at 10% 100%,rgba(124,140,255,.06),transparent 70%),#09090b}
    .card{width:min(620px,100%);padding:42px;border:1px solid var(--stroke);border-radius:24px;background:linear-gradient(180deg,rgba(19,19,24,.96),rgba(13,13,17,.97));box-shadow:0 30px 100px rgba(0,0,0,.45);text-align:center}
    .brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:34px;font-weight:780}.brand img{width:38px;height:38px;border-radius:11px}
    .status-icon{width:64px;height:64px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;font-size:27px;font-weight:900;color:var(--orange);background:rgba(255,122,69,.10);border:1px solid rgba(255,122,69,.25);box-shadow:0 0 0 8px rgba(255,122,69,.035)}
    .status-icon.ok{color:var(--green);background:rgba(97,214,167,.10);border-color:rgba(97,214,167,.25);box-shadow:0 0 0 8px rgba(97,214,167,.035)}
    .status-icon.error{color:var(--red);background:rgba(255,138,115,.08);border-color:rgba(255,138,115,.22)}
    h1{font-size:clamp(32px,7vw,50px);line-height:1.02;letter-spacing:-.055em;margin:0 0 15px}.lead{font-size:16px;line-height:1.65;color:var(--muted);max-width:510px;margin:0 auto}
    .actions{display:grid;gap:10px;margin:30px auto 18px;max-width:360px}.btn{min-height:50px;border-radius:12px;padding:12px 18px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:780;font-size:14px;transition:.16s ease;border:0;cursor:pointer}
    .primary{background:linear-gradient(180deg,#ff8655,#ef6e3d);color:#17100d;box-shadow:0 12px 32px rgba(255,122,69,.18)}.primary:hover{transform:translateY(-1px);filter:brightness(1.04)}
    .secondary{background:#15151b;border:1px solid var(--stroke);color:#e4e6eb}.secondary:hover{background:#1a1a20}
    .note{margin:26px auto 0;padding-top:22px;border-top:1px solid #202027;color:var(--muted2);font-size:12px;line-height:1.65;max-width:500px}.small{margin-top:20px;font-size:11px;color:#666b78}.small a{color:#aeb3c0}
    @media(max-width:540px){.card{padding:30px 22px;border-radius:20px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="../assets/lottopulse-icon.webp" alt=""><span>LottoPulse</span></div>
    <div class="status-icon" id="statusIcon">↗</div>
    <h1 id="title">Attivazione LottoPulse</h1>
    <p class="lead" id="message">Sto verificando l'attivazione dell'estensione…</p>

    <div class="actions">
      <button class="btn primary" id="retryBtn" type="button" hidden>Riprova attivazione</button>
      <a class="btn secondary" id="installBtn" href="https://chromewebstore.google.com/detail/lottopulse/iohmpiampekjmbgnghdcdmflpkhjbial" target="_blank" rel="noopener">Apri LottoPulse nel Chrome Web Store</a>
    </div>

    <div class="note" id="note">Per completare lo sblocco LottoPulse deve essere già installato nello stesso browser usato per il pagamento.</div>
    <div class="small"><a href="../privacy/">Privacy Policy</a> · <a href="../">LottoPulse</a></div>
  </main>

  <script>
    const EXTENSION_ID = 'iohmpiampekjmbgnghdcdmflpkhjbial';
    const params = new URLSearchParams(location.search);
    const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
    const activationKey = hashParams.get('key') || params.get('key') || '';
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const icon = document.getElementById('statusIcon');
    const retry = document.getElementById('retryBtn');
    const install = document.getElementById('installBtn');
    const note = document.getElementById('note');

    function state(kind, heading, body) {
      icon.className = `status-icon ${kind === 'ok' ? 'ok' : kind === 'error' ? 'error' : ''}`;
      icon.textContent = kind === 'ok' ? '✓' : kind === 'error' ? '!' : '↗';
      title.textContent = heading;
      message.textContent = body;
    }

    function sendActivation() {
      retry.hidden = true;
      if (!activationKey) {
        state('error', 'Link di attivazione non valido.', 'Apri questa pagina tramite il reindirizzamento dopo un pagamento completato.');
        note.textContent = 'Nessuna licenza è stata modificata.';
        return;
      }

      state('loading', 'Pagamento completato.', 'Sto sbloccando LottoPulse su questo browser…');

      if (!window.chrome?.runtime?.sendMessage) {
        state('error', 'LottoPulse non è stato rilevato.', 'Installa o abilita LottoPulse in questo browser, poi premi “Riprova attivazione”.');
        retry.hidden = false;
        return;
      }

      try {
        chrome.runtime.sendMessage(EXTENSION_ID, { type: 'LP_ACTIVATE', key: activationKey }, response => {
          if (chrome.runtime.lastError || !response?.ok) {
            const reason = response?.error;
            if (reason === 'missing_username') {
              state('error', 'Manca il nome utente.', 'Apri LottoPulse, scegli prima il tuo nome utente e poi torna al checkout.');
            } else {
              state('error', 'Attivazione non completata.', 'Assicurati che LottoPulse sia installato e attivo, poi premi “Riprova attivazione”.');
            }
            retry.hidden = false;
            return;
          }

          state('ok', 'LottoPulse è sbloccato.', `Ciao ${response.username}. Puoi chiudere questa scheda e aprire LottoPulse dalla barra delle estensioni.`);
          install.textContent = 'Apri la pagina di LottoPulse';
          note.textContent = 'La licenza e il nome utente sono stati salvati localmente nel browser.';
          history.replaceState({}, document.title, location.pathname);
        });
      } catch (_) {
        state('error', 'Attivazione non completata.', 'Assicurati che LottoPulse sia installato e attivo, poi premi “Riprova attivazione”.');
        retry.hidden = false;
      }
    }

    retry.addEventListener('click', sendActivation);
    sendActivation();
  </script>
</body>
</html>
